[project]
name = "ragnar-rag"
version = "0.1.0"
description = "Ragnarize your codebase: a code RAG plugin for AI agents, with language-aware indexing and a read-only MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Júnior" }]
requires-python = ">=3.11"
keywords = ["rag", "mcp", "code-search", "ai-agents", "pgvector", "tree-sitter", "delphi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "tree-sitter>=0.23,<1",
    "tree-sitter-bash>=0.25",
    "tree-sitter-c>=0.24",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-kotlin>=1.1",
    "tree-sitter-pascal>=0.11",
    "tree-sitter-php>=0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-rust>=0.24",
    "tree-sitter-scala>=0.26",
    "tree-sitter-swift>=0.7",
    "tree-sitter-typescript>=0.23",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "httpx>=0.27,<1",
    "mcp>=2.3,<3",
    "prometheus-client>=0.20,<1",
    "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/pedrojr/ragnar"
Issues = "https://github.com/pedrojr/ragnar/issues"
Changelog = "https://github.com/pedrojr/ragnar/blob/main/CHANGELOG.md"

[project.optional-dependencies]
embed = ["fastembed>=0.7,<1"]

[project.scripts]
ragnar = "ragnar.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragnar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Postgres with pgvector (RAGNAR_TEST_ADMIN_DSN)"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"benchmark/report.py" = ["E501"]  # an HTML template
