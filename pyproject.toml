[project]
name = "ragnar-rag"
version = "0.1.0"
description = "Exemplo de RAG de código: indexador, busca híbrida e servidor MCP somente leitura."
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.23,<1",
    "tree-sitter-bash>=0.25",
    "tree-sitter-c>=0.24",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-kotlin>=1.1",
    "tree-sitter-pascal>=0.11",
    "tree-sitter-php>=0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-rust>=0.24",
    "tree-sitter-scala>=0.26",
    "tree-sitter-swift>=0.7",
    "tree-sitter-typescript>=0.23",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "httpx>=0.27,<1",
    "mcp>=2.3,<3",
    "prometheus-client>=0.20,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
embed = ["fastembed>=0.7,<1"]

[project.scripts]
ragnar = "ragnar.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragnar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: precisa de Postgres com pgvector (RAGNAR_TEST_DSN)"]
