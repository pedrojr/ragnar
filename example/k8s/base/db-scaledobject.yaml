# Read replicas by access volume: searches/s measured at the MCP server, through Prometheus.
# CPU does not work here: the Cluster selector includes the primary, so the average mixes writes and reads.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ragnar-db-read
  namespace: ragnar
spec:
  scaleTargetRef:
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    name: ragnar-db
  minReplicaCount: 2                # total instances: 1 primary + 1 replica
  maxReplicaCount: 4                # 1 primary + 3 replicas
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies: [{ type: Pods, value: 1, periodSeconds: 60 }]      # a new replica clones the primary: one at a time
        scaleDown:
          stabilizationWindowSeconds: 300
          policies: [{ type: Pods, value: 1, periodSeconds: 120 }]
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        # searches/s + 10: the extra share reserves the primary's "instance", which serves no reads.
        # Result: 1 replica per 10 searches/s. Fit the threshold to the capacity measured per replica.
        query: (sum(rate(ragnar_search_total{tool="search_code"}[1m])) or vector(0)) + 10
        threshold: "10"
