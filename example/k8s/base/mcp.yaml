# Read-only MCP server. Reads only from ragnar-db-ro as ragnar_reader; never receives the write password.
# No MCP session: any pod answers any request. Scales on CPU. Settings: server.toml, through scripts/up.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragnar-mcp
  namespace: ragnar
  labels: { app: ragnar-mcp }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ragnar-mcp }
  template:
    metadata:
      labels: { app: ragnar-mcp }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: mcp
          image: ragnar-app:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["ragnar", "mcp"]
          env:
            - name: RAGNAR_READER_PASSWORD
              valueFrom: { secretKeyRef: { name: ragnar-reader, key: password } }
            - name: RAGNAR_DSN_READ
              value: host=ragnar-db-ro port=5432 dbname=ragnar user=ragnar_reader password=$(RAGNAR_READER_PASSWORD)
            - { name: RAGNAR_ACL_FILE, value: /run/ragnar/acl.json }
            - { name: RAGNAR_CONFIG, value: /etc/ragnar/server.toml }
            - { name: RAGNAR_POOL_MAX, value: "8" }
            - { name: RAGNAR_POOL_MAX_LIFETIME, value: "120" }   # renews connections, so a new replica receives load
          envFrom:
            - configMapRef: { name: ragnar-embed }
            - secretRef: { name: ragnar-model-keys, optional: true }   # hosted chat model, reranker or embedder
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: acl, mountPath: /run/ragnar, readOnly: true }
            - { name: server, mountPath: /etc/ragnar, readOnly: true }
      volumes:
        - name: acl
          secret: { secretName: ragnar-acl }
        - name: server
          configMap: { name: ragnar-server }   # server.toml, created by scripts/up.sh
---
# LoadBalancer on Docker Desktop publishes on localhost:8080 (the same address as Compose).
apiVersion: v1
kind: Service
metadata:
  name: ragnar-mcp
  namespace: ragnar
spec:
  type: LoadBalancer
  selector: { app: ragnar-mcp }
  ports: [{ port: 8080, targetPort: http, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ragnar-mcp
  namespace: ragnar
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ragnar-mcp }
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 120 }
