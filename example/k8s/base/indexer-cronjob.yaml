# Modelo de indexação dentro do cluster, para repositórios com URL git (ex.: GitLab).
# Suspenso: troque URL e nome, crie o acesso ao git (deploy token) e remova o suspend.
# No CI, a cada merge na main: kubectl -n ragnar create job --from=cronjob/ragnar-indexer-exemplo idx-$(date +%s)
# O exemplo local indexa pelo host: scripts/index.sh.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ragnar-indexer-exemplo
  namespace: ragnar
spec:
  suspend: true
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid          # um escritor por repositório (o indexador também usa advisory lock)
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: indexer
              image: ragnar-app:0.1.0
              imagePullPolicy: IfNotPresent
              command: ["ragnar", "index", "https://gitlab.example.com/grupo/repo.git", "repo"]
              env:
                - name: RAGNAR_WRITER_PASSWORD
                  valueFrom: { secretKeyRef: { name: ragnar-writer, key: password } }
                - name: RAGNAR_DSN_WRITE
                  value: host=ragnar-db-rw port=5432 dbname=ragnar user=ragnar_writer password=$(RAGNAR_WRITER_PASSWORD)
                - { name: EMBED_URL, value: "http://ragnar-embedder:8000/v1" }
                - { name: HOME, value: /cache }
              envFrom:
                - configMapRef: { name: ragnar-embed }
              volumeMounts:
                - { name: cache, mountPath: /cache }
          volumes:
            - name: cache
              emptyDir: {}
