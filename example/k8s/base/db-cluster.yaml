# Postgres managed by CloudNativePG: 1 primary (writes) + replicas (reads).
# Services created by the operator: ragnar-db-rw (primary), ragnar-db-ro (replicas only), ragnar-db-r (any).
# KEDA (db-scaledobject.yaml) changes spec.instances with the search volume.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ragnar-db
  namespace: ragnar
spec:
  instances: 2                      # 1 primary + 1 replica
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10-standard-trixie   # standard includes pgvector
  postgresql:
    parameters:
      shared_buffers: "128MB"
      hot_standby_feedback: "on"    # avoids cancelling replica searches after a reindex VACUUM
      max_standby_streaming_delay: "30s"
  bootstrap:
    initdb:
      database: ragnar
      owner: ragnar_writer
      secret:
        name: ragnar-writer            # password from .env, the one the indexer uses
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
      postInitApplicationSQLRefs:
        secretRefs:
          - name: ragnar-db-init-sql   # creates ragnar_reader with default_transaction_read_only = on
            key: init.sql
  storage:
    size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
