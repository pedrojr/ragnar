# Optional: index on every push instead of waiting for the worker's next pass.
# Copy to .github/workflows/ragnar-index.yml in your project.
#
# Requires a runner that reaches the primary and the embedder (a self-hosted runner, a VPN, or
# an external embedding provider). Without that path, rely on the worker: it needs no inbound network.
#
# Repository settings:
#   secret   RAGNAR_DSN_WRITE     postgresql://ragnar_writer:...@host:5432/ragnar
#   variable RAGNAR_EMBEDDING_URL http://embedder.internal:8000/v1
name: ragnar-index

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    concurrency: ragnar-index   # one writer at a time
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      # ragnar index runs gitleaks on the files it indexes. gitleaks-action would scan again, and it needs a
      # license key in organization repositories.
      - name: Install gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Index the pushed commit
        env:
          RAGNAR_DSN_WRITE: ${{ secrets.RAGNAR_DSN_WRITE }}
          RAGNAR__EMBEDDING__URL: ${{ vars.RAGNAR_EMBEDDING_URL }}
        run: uvx --from git+https://github.com/pedrojr/ragnar ragnar index . "${{ github.event.repository.name }}" --ref "${{ github.sha }}"
