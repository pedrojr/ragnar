# Optional: index on every push instead of waiting for the worker's next pass.
# Copy to .github/workflows/ragnar-index.yml in your project.
#
# Requires a runner that reaches the primary and the embedder (a self-hosted runner, a VPN, or
# an external embedding provider). Without that path, rely on the worker: it needs no inbound network.
#
# Repository settings:
#   secret   RAGNAR_DSN_WRITE     postgresql://ragnar_writer:...@host:5432/ragnar
#   variable RAGNAR_EMBEDDING_URL http://embedder.internal:8000/v1
#   variable RAGNAR_CONFIG        path of a copy of the worker's server.toml in this repository
#
# Give this job the worker's server.toml through RAGNAR_CONFIG, for example from a copy in this repository.
# With other settings, such as summaries or contextual retrieval on the worker only, each CI run and the
# next worker pass rebuild the index in full, and CI runs drop the summaries.
# Pin Ragnar to the commit the worker runs (RAGNAR_REF below). Another version may chunk files differently,
# and then each CI run and the next worker pass rebuild the index in full. Change it when you update the worker.
name: ragnar-index

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  RAGNAR_REF: 98e6a9e764e5c95397504f56eeca221f5df23ad5

jobs:
  index:
    runs-on: ubuntu-latest
    concurrency: ragnar-index   # one writer at a time
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      # ragnar index runs gitleaks on the files it indexes. gitleaks-action would scan again, and it needs a
      # license key in organization repositories.
      - name: Install gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Index the pushed commit
        env:
          RAGNAR_DSN_WRITE: ${{ secrets.RAGNAR_DSN_WRITE }}
          RAGNAR__EMBEDDING__URL: ${{ vars.RAGNAR_EMBEDDING_URL }}
          RAGNAR_CONFIG: ${{ vars.RAGNAR_CONFIG }}   # empty when unset: the project's own file applies
        run: uvx --from "git+https://github.com/pedrojr/ragnar@${RAGNAR_REF}" ragnar index . "${{ github.event.repository.name }}" --ref "${{ github.sha }}"
