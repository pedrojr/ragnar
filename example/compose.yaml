# Reference infrastructure: 1 primary (writes) + N replicas (reads), embedder, MCP server,
# and a worker that follows the branches listed in repos.toml. Step by step: README.md.
#   uv run --project .. ragnar init-env
#   docker compose up -d --build --scale db-replica=2
# Compose scales by hand with --scale. For automatic scaling, use Kubernetes (k8s/).
name: ragnar

x-app: &app
  image: ragnar-app:0.1.0   # built by the ragnar-mcp service
  # no env_file here: each service receives only the credential it uses (the MCP never sees the write password)

x-embedding: &embedding
  RAGNAR__EMBEDDING__URL: ${RAGNAR__EMBEDDING__URL:-http://embedder:8000/v1}
  RAGNAR__EMBEDDING__MODEL: ${RAGNAR__EMBEDDING__MODEL:-jinaai/jina-embeddings-v2-base-code}
  RAGNAR__EMBEDDING__DIM: ${RAGNAR__EMBEDDING__DIM:-768}
  RAGNAR_EMBEDDING_API_KEY: ${RAGNAR_EMBEDDING_API_KEY:-}

services:
  db-primary:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run "uv run --project .. ragnar init-env" first}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      RAGNAR_WRITER_PASSWORD: ${RAGNAR_WRITER_PASSWORD}
      RAGNAR_READER_PASSWORD: ${RAGNAR_READER_PASSWORD}
    command: ["postgres", "-c", "wal_keep_size=256MB"]
    ports: ["127.0.0.1:15432:5432"]   # only for manual indexing from the host (5432 often has a local Postgres); the MCP does not use it
    volumes:
      - primary-data:/var/lib/postgresql/data
      - ./docker/postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      # over TCP: during the first init the entrypoint runs a socket-only server, and migrate connects over TCP
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "ragnar"]
      interval: 2s
      retries: 30

  db-replica:
    image: pgvector/pgvector:0.8.7-pg17
    user: postgres
    environment:
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    entrypoint: ["bash", "/scripts/replica-entrypoint.sh"]
    volumes:
      - ./docker/postgres/replica-entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    depends_on:
      db-primary: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 60

  embedder:
    image: ragnar-embedder:0.1.0
    build:
      context: ..
      dockerfile: example/docker/Dockerfile
      target: embedder
      args:
        # its own variable: pointing RAGNAR__EMBEDDING__* at a hosted model must not break this container
        EMBED_MODEL: ${RAGNAR_LOCAL_EMBED_MODEL:-jinaai/jina-embeddings-v2-base-code}
    environment:
      RAGNAR_EMBED_THREADS: ${RAGNAR_EMBED_THREADS:-4}   # raise it for a first build of a large repository
      RAGNAR_EMBED_BATCH: ${RAGNAR_EMBED_BATCH:-8}       # lower it if the container runs out of memory
      RAGNAR__EMBEDDING__MODEL: ${RAGNAR_LOCAL_EMBED_MODEL:-jinaai/jina-embeddings-v2-base-code}
    mem_limit: ${RAGNAR_EMBED_MEMORY:-3g}   # going over kills only the container, not the Docker VM
    ports: ["127.0.0.1:8001:8000"]   # only for manual indexing from the host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      retries: 60

  migrate:
    <<: *app
    command: ["ragnar", "migrate"]
    environment:
      <<: *embedding
      RAGNAR_DSN_WRITE: postgresql://ragnar_writer:${RAGNAR_WRITER_PASSWORD}@db-primary:5432/ragnar
    depends_on:
      db-primary: { condition: service_healthy }
    restart: "no"

  ragnar-mcp:
    <<: *app
    build: { context: .., dockerfile: example/docker/Dockerfile, target: app }
    command: ["ragnar", "mcp"]
    environment:
      <<: *embedding
      # host=db-replica: Docker DNS spreads connections across the replicas (rough, enough for development)
      RAGNAR_DSN_READ: postgresql://ragnar_reader:${RAGNAR_READER_PASSWORD}@db-replica:5432/ragnar
      RAGNAR_ACL_FILE: /run/ragnar/acl.json
      RAGNAR_CONFIG: /etc/ragnar/server.toml
      RAGNAR_LLM_API_KEY: ${RAGNAR_LLM_API_KEY:-}         # hosted chat model: multi-query, HyDE
      RAGNAR_RERANK_API_KEY: ${RAGNAR_RERANK_API_KEY:-}   # hosted reranker
      # graph access events (where each tool call read), on ragnar.mcp.<repo>.<tool>; none turns them off
      RAGNAR__EVENTS__PROVIDER: ${RAGNAR_EVENTS_PROVIDER:-nats}
      RAGNAR__EVENTS__URL: nats://nats:4222
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reaches an Ollama running on the host, for multi-query and HyDE
    volumes:
      - ./acl.json:/run/ragnar/acl.json:ro
      - ./server.toml:/etc/ragnar/server.toml:ro
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db-replica: { condition: service_healthy }
      embedder: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Receives the MCP server's graph access events. Watch them: docker compose run --rm nats-box nats sub "ragnar.mcp.>"
  # The MCP does not wait for it: with NATS down, events are dropped and counted, and tool calls go on.
  nats:
    image: nats:2.11.8-alpine
    command: ["--http_port", "8222"]
    ports: ["127.0.0.1:14222:4222"]   # for the integration tests on the host
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      retries: 10

  nats-box:
    image: natsio/nats-box:0.18.1
    profiles: ["tools"]
    environment: { NATS_URL: "nats://nats:4222" }
    depends_on:
      nats: { condition: service_healthy }

  # The only writer: mirrors each repository in repos.toml and indexes new commits of its branch.
  indexer:
    <<: *app
    command: ["ragnar", "sync", "--config", "/etc/ragnar/repos.toml", "--watch", "--interval", "${RAGNAR_SYNC_INTERVAL:-60}"]
    environment:
      <<: *embedding
      RAGNAR_DSN_WRITE: postgresql://ragnar_writer:${RAGNAR_WRITER_PASSWORD}@db-primary:5432/ragnar
      RAGNAR_CONFIG: /etc/ragnar/server.toml
      RAGNAR_GIT_TOKEN: ${RAGNAR_GIT_TOKEN:-}
      RAGNAR_LLM_API_KEY: ${RAGNAR_LLM_API_KEY:-}   # hosted chat model: summaries, contextual retrieval
      HOME: /cache
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reaches an Ollama running on the host, on Linux too
    volumes:
      - ./repos.toml:/etc/ragnar/repos.toml:ro
      - ./server.toml:/etc/ragnar/server.toml:ro
      - indexer-cache:/cache
    restart: unless-stopped
    depends_on:
      embedder: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # On-demand tools: docker compose run --rm tools smoke --repo myapp --url http://ragnar-mcp:8080/mcp --replica-host db-replica
  tools:
    <<: *app
    profiles: ["tools"]
    entrypoint: ["ragnar"]
    env_file: .env   # MCP tokens for smoke and load
    environment:
      <<: *embedding
      RAGNAR_DSN_WRITE: postgresql://ragnar_writer:${RAGNAR_WRITER_PASSWORD}@db-primary:5432/ragnar
      RAGNAR_DSN_READ: postgresql://ragnar_reader:${RAGNAR_READER_PASSWORD}@db-replica:5432/ragnar

volumes:
  primary-data:
  indexer-cache:
