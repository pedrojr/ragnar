# Verificação ponta a ponta dentro do cluster: MCP via Service e barreiras de escrita.
apiVersion: batch/v1
kind: Job
metadata:
  name: rag-smoke
  namespace: rag
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: rag-app:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["rag", "smoke", "--url", "http://rag-mcp:8080/mcp", "--repo", "yak", "--replica-host", "rag-db-ro"]
          env:
            - name: RAG_WRITER_PASSWORD
              valueFrom: { secretKeyRef: { name: rag-writer, key: password } }
            - name: RAG_READER_PASSWORD
              valueFrom: { secretKeyRef: { name: rag-reader, key: password } }
            - name: RAG_DSN_WRITE
              value: host=rag-db-rw port=5432 dbname=rag user=rag_writer password=$(RAG_WRITER_PASSWORD)
            - name: RAG_DSN_READ
              value: host=rag-db-ro port=5432 dbname=rag user=rag_reader password=$(RAG_READER_PASSWORD)
          envFrom:
            - secretRef: { name: rag-mcp-tokens }
