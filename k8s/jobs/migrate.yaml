# Aplica as migrações no primário. scripts/up.sh recria este Job a cada subida.
apiVersion: batch/v1
kind: Job
metadata:
  name: rag-migrate
  namespace: rag
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: rag-app:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["rag", "migrate"]
          env:
            - name: RAG_WRITER_PASSWORD
              valueFrom: { secretKeyRef: { name: rag-writer, key: password } }
            - name: RAG_DSN_WRITE
              value: host=rag-db-rw port=5432 dbname=rag user=rag_writer password=$(RAG_WRITER_PASSWORD)
