# Embedder em Python (fastembed/ONNX, CPU). Sem estado; modelo embutido na imagem. Escala por CPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-embedder
  namespace: rag
  labels: { app: rag-embedder }
spec:
  replicas: 1
  selector:
    matchLabels: { app: rag-embedder }
  template:
    metadata:
      labels: { app: rag-embedder }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: embedder
          image: rag-embedder:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: EMBED_THREADS, value: "4" }
          envFrom:
            - configMapRef: { name: rag-embed }
          ports: [{ containerPort: 8000, name: http }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { cpu: "4", memory: 2560Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: rag-embedder
  namespace: rag
spec:
  selector: { app: rag-embedder }
  ports: [{ port: 8000, targetPort: http, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-embedder
  namespace: rag
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: rag-embedder }
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 120 }
